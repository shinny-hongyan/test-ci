name: build zq

on: push

jobs:
  build-on-docker:
    runs-on: ubuntu-latest

    container:
      image: "debian:11"
      options: --shm-size=2g
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}

    steps:
      - name: Install all dependencies
        run: |
          apt-get update
          apt install -y git git-lfs

      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true
          submodules: recursive

      - name: Print
        run: |
          pwd
          echo "Current directory: $(pwd)"
          echo "GitHub workspace: ${{ github.workspace }}"
          echo "Contents:"
          ls -lrth

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Build
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: "${{ github.workspace }}/CMakeLists.txt"
          configurePreset: "default"
          buildPreset: "release"
          configurePresetAdditionalArgs: "['-DCMAKE_TOOLCHAIN_FILE=/home/runner/work/test-ci/test-ci/vcpkg/scripts/buildsystems/vcpkg.cmake']"

      - name: Test
        run: |
          ls -lrth
          cd ${{ github.workspace }}/build
          ./rapidjson_demo


